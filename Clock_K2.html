<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock_K2</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg1: #f3f1ec; --bg2: #cdc8bd;
  --shadow: rgba(40, 32, 20, .5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg1: #2c2d33; --bg2: #0b0b0e; --shadow: rgba(0, 0, 0, .85); }
}
:root[data-theme="dark"] { --bg1: #2c2d33; --bg2: #0b0b0e; --shadow: rgba(0, 0, 0, .85); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, var(--bg1), var(--bg2) 85%);
}
.scene {
  --size: min(92vw, 92vh, 720px);
  --size: min(92vw, 92dvh, 720px);
  --u: calc(var(--size) / 100);
  --gx: 35%; --gy: 25%; --ba: 0deg;
  width: var(--size); height: var(--size); perspective: 1300px;
}
.clock { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; }
.clock > * { position: absolute; inset: 0; border-radius: 50%; }

.wall {
  inset: 4%; background: var(--shadow); filter: blur(calc(var(--u) * 4));
  transform: translate3d(calc(var(--u) * 5), calc(var(--u) * 7), calc(var(--u) * -12));
}
/* brushed-metal case side, darker toward the back */
.edge {
  background:
    linear-gradient(rgba(0,0,0,calc(var(--i) * .022)), rgba(0,0,0,calc(var(--i) * .022))),
    conic-gradient(from 20deg, #3c3c41, #121214, #4d4d54, #0d0d0f, #3c3c41);
  transform: translateZ(calc(var(--u) * var(--i) * -.4));
}
.bezel {
  background: conic-gradient(from var(--ba), #4a4a50, #1b1b1e 12%, #6a6a72 25%, #121214 38%, #54545b 50%, #1b1b1e 62%, #6e6e76 75%, #141416 88%, #4a4a50);
  transform: translateZ(calc(var(--u) * .5));
  box-shadow: 0 0 0 1px rgba(0,0,0,.3);
}
.bezel-in {
  inset: 3.2%;
  background: conic-gradient(from calc(var(--ba) * -1 + 40deg), #2c2c30, #5a5a62 20%, #16161a 40%, #48484f 60%, #101012 80%, #2c2c30);
  transform: translateZ(calc(var(--u) * .7));
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}
.dial { inset: 6.5%; overflow: hidden; transform: translateZ(calc(var(--u) * .9)); }
.dial svg { width: 100%; height: 100%; display: block; }
.dial::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset calc(var(--u) * .8) calc(var(--u) * 1.2) calc(var(--u) * 2.4) rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.35);
}
.logo path { fill-opacity: .45; }
.logo .eyes { fill-opacity: 1; }
.eyes { transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 2px #ff2a2a); }
.dial #dig { filter: drop-shadow(0 0 1.5px rgba(255,214,10,.7)); }
.hand { pointer-events: none; }
.hand svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hh { transform: translateZ(calc(var(--u) * 2.4)); filter: drop-shadow(calc(var(--u) * .5) calc(var(--u) * .8) calc(var(--u) * .7) rgba(0,0,0,.35)); }
.mm { transform: translateZ(calc(var(--u) * 3.2)); filter: drop-shadow(calc(var(--u) * .7) calc(var(--u) * 1.1) calc(var(--u) * .9) rgba(0,0,0,.33)); }
.ss { transform: translateZ(calc(var(--u) * 4)); filter: drop-shadow(calc(var(--u) * .9) calc(var(--u) * 1.4) calc(var(--u) * 1.1) rgba(0,0,0,.3)); }
.hub {
  inset: auto; left: 47%; top: 47%; width: 6%; height: 6%;
  background: radial-gradient(circle, #ffd60a 0 22%, transparent 24%), radial-gradient(circle at 35% 30%, #fff, #c9ced6 40%, #6d7480 100%);
  transform: translateZ(calc(var(--u) * 4.6));
  box-shadow: calc(var(--u) * .8) calc(var(--u) * 1.4) calc(var(--u) * 1.4) rgba(0,0,0,.35);
}
.glass {
  inset: 5%; pointer-events: none; transform: translateZ(calc(var(--u) * 6));
  background:
    radial-gradient(ellipse 60% 45% at var(--gx) var(--gy), rgba(255,255,255,.42), rgba(255,255,255,0) 70%),
    linear-gradient(155deg, rgba(255,255,255,.12), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), inset 0 0 calc(var(--u) * 3) rgba(255,255,255,.18);
}
</style>
</head>

<script>
(function () {
  var scene = document.getElementById('scene'), clock = document.getElementById('clock');
  var hh = document.querySelector('.hh'), mm = document.querySelector('.mm'), ss = document.querySelector('.ss');

  // case thickness: many thin discs so no banding shows when tilted
  var bezel = clock.querySelector('.bezel');
  for (var i = 21; i >= 0; i--) {
    var e = document.createElement('div');
    e.className = 'edge'; e.style.setProperty('--i', i);
    clock.insertBefore(e, bezel);
  }

  // numerals and the 60-LED seconds ring
  var NS = 'http://www.w3.org/2000/svg', nums = document.getElementById('nums'), leds = document.getElementById('leds');
  for (var n = 1; n <= 12; n++) {
    var a = n * Math.PI / 6, tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', (200 + 140 * Math.sin(a)).toFixed(1));
    tx.setAttribute('y', (200 - 140 * Math.cos(a)).toFixed(1));
    tx.textContent = n; nums.appendChild(tx);
  }
  var dots = [], halos = [];
  for (var k = 0; k < 60; k++) {
    var b = k * Math.PI / 30, big = k % 5 === 0;
    var x = (200 + 184 * Math.sin(b)).toFixed(1), y = (200 - 184 * Math.cos(b)).toFixed(1);
    var h = document.createElementNS(NS, 'circle'), c = document.createElementNS(NS, 'circle');
    h.setAttribute('cx', x); h.setAttribute('cy', y); h.setAttribute('r', big ? 10 : 7.5); h.setAttribute('fill', '#1f7bff'); h.setAttribute('opacity', 0);
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', big ? 5.4 : 3.8);
    leds.appendChild(h); leds.appendChild(c); halos.push(h); dots.push({ el: c, big: big });
  }
  var dig = document.getElementById('dig'), lastS = -1, lastL = -999;
  function pad(v) { return (v < 10 ? '0' : '') + v; }
  // seven-segment readout (drawn as vector segments)
  var SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
  var ON = '#ffd60a', OFF = '#2d2706', digits = [], lastStr = '';
  (function () {
    var w = 9, hgt = 15, t = 2.2, g = .35, y0 = 303.5, hy = hgt / 2;
    function hz(x0, yc) { return [[x0 + t / 2 + g, yc], [x0 + t + g, yc - t / 2], [x0 + w - t - g, yc - t / 2], [x0 + w - t / 2 - g, yc], [x0 + w - t - g, yc + t / 2], [x0 + t + g, yc + t / 2]]; }
    function vt(xc, ya, yb) { return [[xc, ya], [xc + t / 2, ya + t / 2], [xc + t / 2, yb - t / 2], [xc, yb], [xc - t / 2, yb - t / 2], [xc - t / 2, ya + t / 2]]; }
    function poly(pts) { var e = document.createElementNS(NS, 'polygon'); e.setAttribute('points', pts.map(function (q) { return q[0].toFixed(2) + ',' + q[1].toFixed(2); }).join(' ')); e.setAttribute('fill', OFF); dig.appendChild(e); return e; }
    [158.5, 170.5, 188.5, 200.5, 219.5, 231.5].forEach(function (x0) {
      var xl = x0 + t / 2, xr = x0 + w - t / 2, sm = { a: poly(hz(x0, y0 + t / 2)), g: poly(hz(x0, y0 + hy)), d: poly(hz(x0, y0 + hgt - t / 2)),
        f: poly(vt(xl, y0 + t / 2 + g, y0 + hy - g)), b: poly(vt(xr, y0 + t / 2 + g, y0 + hy - g)),
        e: poly(vt(xl, y0 + hy + g, y0 + hgt - t / 2 - g)), c: poly(vt(xr, y0 + hy + g, y0 + hgt - t / 2 - g)) };
      digits.push(sm);
    });
    [182.2, 213.2].forEach(function (cxp) {
      [y0 + hgt * .3, y0 + hgt * .7].forEach(function (cyp) {
        var r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', cxp); r.setAttribute('y', cyp - 1); r.setAttribute('width', 2); r.setAttribute('height', 2); r.setAttribute('fill', ON);
        dig.appendChild(r);
      });
    });
  })();
  function setDigits(str) {
    if (str === lastStr) return; lastStr = str;
    for (var q = 0; q < 6; q++) {
      var on = SEG[str.charAt(q)];
      for (var key in digits[q]) digits[q][key].setAttribute('fill', on.indexOf(key) >= 0 ? ON : OFF);
    }
  }
  // LEDs light exactly when the second hand passes them
  function paintLeds(L) {
    for (var j = 0; j < 60; j++) {
      var lit = j <= L;
      dots[j].el.setAttribute('fill', lit ? '#2a8cff' : (dots[j].big ? '#7a8aa8' : '#12254d'));
      halos[j].setAttribute('opacity', lit ? .32 : 0);
    }
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var px = 0, py = 0, cx = 0, cy = 0;
  if (!reduce) {
    addEventListener('pointermove', function (ev) {
      px = (ev.clientX / innerWidth - .5) * 2; py = (ev.clientY / innerHeight - .5) * 2;
    });
    document.documentElement.addEventListener('mouseleave', function () { px = 0; py = 0; });
  }

  // quartz-style tick: quick snap with a small overshoot, then settle
  function tick(f) {
    if (f >= .16) return 1;
    var x = f / .16 - 1;
    return 1 + 2.2 * x * x * x + 1.2 * x * x;
  }

  var eyes = document.querySelector('.eyes'), lastBlinkMark = -1;

  var logo = document.querySelector('.logo');
  var bat = Array.prototype.find.call(logo.querySelectorAll(':scope > path'), function (path) {
    var box = path.getBBox();
    return box.x > 18 && box.x < 25 && box.y > 48 && box.y < 52 &&
      box.width > 125 && box.width < 140 && box.height > 45 && box.height < 60;
  });
  var wings = [];
  if (bat) {
    var defs = logo.ownerSVGElement.querySelector('defs');
    var batLayer = document.createElementNS(NS, 'g');
    batLayer.setAttribute('opacity', '.45');
    logo.insertBefore(batLayer, bat);
    [
      { side: 'left', x: 0, width: 80, originX: 79, originY: 70 },
      { side: 'right', x: 101, width: 79, originX: 101, originY: 70 }
    ].forEach(function (wingInfo) {
      var clip = document.createElementNS(NS, 'clipPath'), rect = document.createElementNS(NS, 'rect');
      clip.id = 'bat-' + wingInfo.side + '-wing-clip';
      clip.setAttribute('clipPathUnits', 'userSpaceOnUse');
      rect.setAttribute('x', wingInfo.x); rect.setAttribute('y', 0);
      rect.setAttribute('width', wingInfo.width); rect.setAttribute('height', 200);
      clip.appendChild(rect); defs.appendChild(clip);

      var wing = bat.cloneNode(true);
      wing.setAttribute('clip-path', 'url(#' + clip.id + ')');
      wing.style.fillOpacity = '1';
      batLayer.appendChild(wing);
      wings.push({
        el: wing,
        side: wingInfo.side,
        originX: wingInfo.originX,
        originY: wingInfo.originY,
        flapStart: null
      });
    });
    var bodyClip = document.createElementNS(NS, 'clipPath'), bodyRect = document.createElementNS(NS, 'rect');
    bodyClip.id = 'bat-body-clip';
    bodyClip.setAttribute('clipPathUnits', 'userSpaceOnUse');
    bodyRect.setAttribute('x', 78); bodyRect.setAttribute('y', 0);
    bodyRect.setAttribute('width', 25); bodyRect.setAttribute('height', 200);
    bodyClip.appendChild(bodyRect); defs.appendChild(bodyClip);
    bat.setAttribute('clip-path', 'url(#bat-body-clip)');
    bat.style.fillOpacity = '1';
    batLayer.appendChild(bat);
  }
  var lastMinute = new Date().getMinutes();
  function frame(now) {
    var d = new Date(), S = d.getSeconds(), ms = d.getMilliseconds() / 1000;
    var M = d.getMinutes(), H = d.getHours() % 12;
    if (M !== lastMinute) {
      lastMinute = M;
      if (!reduce) {
        wings.forEach(function (wing) {
          wing.flapStart = now;
        });
      }
    }
    wings.forEach(function (wing) {
      if (wing.flapStart === null) return;
      var progress = (now - wing.flapStart) / 1800;
      if (progress >= 1) {
        wing.el.removeAttribute('transform');
        wing.flapStart = null;
        return;
      }
      var direction = wing.side === 'left' ? -1 : 1;
      var eased = progress * progress * progress * (progress * (progress * 6 - 15) + 10);
      var angle = direction * Math.sin(eased * Math.PI * 2) * 6;
      wing.el.setAttribute('transform', 'rotate(' + angle.toFixed(3) + ' ' + wing.originX + ' ' + wing.originY + ')');
    });
    var blinkMark = (d.getHours() * 60 + M) * 4 + Math.floor(S / 15);
    if (eyes && S % 15 === 0 && blinkMark !== lastBlinkMark) {
      lastBlinkMark = blinkMark;
      eyes.animate([
        { transform: 'scaleY(1)', opacity: 1 },
        { transform: 'scaleY(.005)', opacity: 0, offset: .19 },
        { transform: 'scaleY(.005)', opacity: 0, offset: .81 },
        { transform: 'scaleY(1)', opacity: 1 }
      ], { duration: 800, easing: 'ease-in-out' });
    }
    var tk = tick(ms);
    var L = Math.floor(S - 1 + Math.min(tk, 1) + .5);
    if (L !== lastL) { lastL = L; paintLeds(L); }
    if (S !== lastS) { lastS = S; setDigits(pad(d.getHours()) + pad(M) + pad(S)); }
    var mf = M + S / 60;
    ss.style.rotate = ((S - 1 + tk) * 6) + 'deg';
    mm.style.rotate = (mf * 6) + 'deg';
    hh.style.rotate = ((H + mf / 60) * 30) + 'deg';

    var s = now / 1000;
    var ry = (reduce ? -14 : Math.sin(s * .31) * 16 - 6) - px * 18;
    var rx = (reduce ? 12 : Math.sin(s * .23 + 1) * 7 + 10) + py * 14;
    cx += (rx - cx) * .06; cy += (ry - cy) * .06;
    clock.style.transform = 'rotateX(' + cx.toFixed(2) + 'deg) rotateY(' + cy.toFixed(2) + 'deg)';
    scene.style.setProperty('--ba', (cy * 3 + cx * 1.5).toFixed(1) + 'deg');
    scene.style.setProperty('--gx', Math.max(10, Math.min(90, 50 - cy * 1.6)).toFixed(1) + '%');
    scene.style.setProperty('--gy', Math.max(5, Math.min(80, 30 + cx * 1.2)).toFixed(1) + '%');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
